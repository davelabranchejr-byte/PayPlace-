name: Build 24 with Xcode 26 and submit through Expo

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Check the native build without Apple signing or uploading
        type: boolean
        default: false
      signing_only:
        description: Sign locally and submit using Expo saved Apple credentials
        type: boolean
        default: true
      build_number:
        description: Build number for a signing-only archive
        type: string
        default: '24'

permissions:
  contents: read

concurrency:
  group: payplace-ios-local-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      CI: '1'
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PAYPLACE_SIGNING_ONLY: ${{ inputs.signing_only }}
      PAYPLACE_BUILD_NUMBER: ${{ inputs.build_number }}
      APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - name: Verify Apple-required Xcode and iOS SDK
        run: |
          xcodebuild -version
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          if [ "${sdk_version%%.*}" -lt 26 ]; then
            echo "::error::Apple requires the iOS 26 SDK or later"
            exit 1
          fi
      - name: Verify Apple signing and upload credentials
        if: ${{ !inputs.validate_only }}
        run: |
          missing=0
          required=(APPLE_DISTRIBUTION_CERTIFICATE_BASE64 APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE_BASE64)
          if [ "$PAYPLACE_SIGNING_ONLY" != 'true' ]; then
            required+=(APP_STORE_CONNECT_API_KEY_BASE64 APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID)
          fi
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing encrypted repository secret EXPO_TOKEN"
            missing=1
          fi
          exit "$missing"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install dependencies and run checks
        run: |
          npm ci
          npm test
          gem install fastlane cocoapods --no-document
      - name: Validate release script syntax
        run: |
          ruby -ryaml -e 'workflow = YAML.load_file(ARGV[0]); script = workflow.fetch("jobs").fetch("release").fetch("steps").find { |s| s["name"] == "Archive with Xcode and upload to TestFlight" }.fetch("run"); body = script.split("<<\x27RUBY\x27\n", 2).fetch(1).split("\nRUBY\n", 2).first; IO.popen(["ruby", "-c"], "w") { |io| io.write(body) }; exit($?.exitstatus)' .github/workflows/release-ios-expo.yml
      - name: Generate the native Xcode project
        # Local open-source generator only; no EAS service or Expo account.
        run: |
          npx expo prebuild --platform ios --no-install
          cd ios
          pod install
      - name: Compile the native release without signing
        if: ${{ inputs.validate_only }}
        run: |
          if ! xcodebuild -workspace ios/PayPlace.xcworkspace -scheme PayPlace -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/PayPlace-validation" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/payplace-native-build.log" 2>&1; then
            tail -n 120 "$RUNNER_TEMP/payplace-native-build.log"
            exit 1
          fi
          tail -n 20 "$RUNNER_TEMP/payplace-native-build.log"
          echo 'Native Release build passed without signing. No build was uploaded to Apple.' >> "$GITHUB_STEP_SUMMARY"
      - name: Archive with Xcode and upload to TestFlight
        if: ${{ !inputs.validate_only }}
        run: |
          mkdir -p fastlane
          cat > fastlane/Fastfile <<'RUBY'
          require 'base64'
          require 'json'
          require 'securerandom'
          require 'fileutils'
          require 'open3'
          require 'shellwords'
          require 'plist'
          require 'time'

          default_platform(:ios)
          platform :ios do
            lane :release do
              bundle_id = 'com.davelabranchejr.payplace'
              root = ENV.fetch('GITHUB_WORKSPACE')
              temporary = File.join(ENV.fetch('RUNNER_TEMP'), 'payplace-signing')
              FileUtils.mkdir_p(temporary, mode: 0700)
              certificate = File.join(temporary, 'distribution.p12')
              profile_path = File.join(temporary, 'distribution.mobileprovision')
              keychain = File.join(temporary, 'release.keychain-db')
              installed_profile = nil
              begin
                File.write(certificate, Base64.strict_decode64(ENV.fetch('APPLE_DISTRIBUTION_CERTIFICATE_BASE64').gsub(/\s/, '')), mode: 'wb', perm: 0600)
                File.write(profile_path, Base64.strict_decode64(ENV.fetch('APPLE_PROVISIONING_PROFILE_BASE64').gsub(/\s/, '')), mode: 'wb', perm: 0600)
                decoded, status = Open3.capture2('security', 'cms', '-D', '-i', profile_path)
                UI.user_error!('Cannot decode Apple provisioning profile') unless status.success?
                profile = Plist.parse_xml(decoded)
                team_id = profile.fetch('TeamIdentifier').first
                uuid = profile.fetch('UUID')
                entitlement = profile.fetch('Entitlements')
                prefix = profile.fetch('ApplicationIdentifierPrefix').first
                UI.user_error!('Profile must match PayPlace bundle identifier') unless entitlement['application-identifier'] == "#{prefix}.#{bundle_id}"
                UI.user_error!('Use an App Store distribution profile') if profile['ProvisionedDevices'] || profile['ProvisionsAllDevices'] || entitlement['get-task-allow']
                UI.user_error!('Provisioning profile has expired') if Time.parse(profile.fetch('ExpirationDate').to_s) <= Time.now
                UI.user_error!('Invalid profile UUID') unless uuid.match?(/\A[0-9A-F-]{36}\z/i)
                installed_profile = File.expand_path("~/Library/MobileDevice/Provisioning Profiles/#{uuid}.mobileprovision")
                FileUtils.mkdir_p(File.dirname(installed_profile))
                FileUtils.cp(profile_path, installed_profile)
                File.chmod(0600, installed_profile)

                password = SecureRandom.hex(32)
                create_keychain(path: keychain, password: password, unlock: true, timeout: 7200, require_create: true)
                import_certificate(certificate_path: certificate, certificate_password: ENV.fetch('APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD'), keychain_path: keychain, keychain_password: password, log_output: false)
                signing_only = ENV['PAYPLACE_SIGNING_ONLY'] == 'true'
                api_key = unless signing_only
                  app_store_connect_api_key(
                  key_id: ENV.fetch('APP_STORE_CONNECT_API_KEY_ID'),
                  issuer_id: ENV.fetch('APP_STORE_CONNECT_ISSUER_ID'),
                  key_content: ENV.fetch('APP_STORE_CONNECT_API_KEY_BASE64').gsub(/\s/, ''),
                    is_key_content_base64: true, in_house: false
                  )
                end
                version = JSON.parse(File.read(File.join(root, 'app.json'))).fetch('expo').fetch('version')
                # Apple owns this build counter; no Expo version service is used.
                build_number = if signing_only
                  requested = ENV.fetch('PAYPLACE_BUILD_NUMBER')
                  UI.user_error!('Build number must be a positive integer') unless requested.match?(/\A[1-9][0-9]*\z/)
                  requested.to_i
                else
                  latest_testflight_build_number(api_key: api_key, app_identifier: bundle_id, version: version, initial_build_number: 23) + 1
                end
                project = File.join(root, 'ios/PayPlace.xcodeproj')
                increment_build_number(build_number: build_number, xcodeproj: project)
                update_code_signing_settings(
                  path: project, targets: ['PayPlace'], build_configurations: ['Release'],
                  use_automatic_signing: false, team_id: team_id,
                  code_sign_identity: 'Apple Distribution', profile_uuid: uuid
                )
                ipa = build_app(
                  workspace: File.join(root, 'ios/PayPlace.xcworkspace'), scheme: 'PayPlace',
                  configuration: 'Release', destination: 'generic/platform=iOS',
                  output_directory: ENV.fetch('RUNNER_TEMP'), output_name: 'PayPlace.ipa',
                  archive_path: File.join(ENV.fetch('RUNNER_TEMP'), 'PayPlace.xcarchive'),
                  export_method: 'app-store', export_team_id: team_id,
                  xcargs: "OTHER_CODE_SIGN_FLAGS=#{Shellwords.escape("--keychain #{keychain}")}",
                  export_options: { signingStyle: 'manual', signingCertificate: 'Apple Distribution', provisioningProfiles: { bundle_id => uuid }, manageAppVersionAndBuildNumber: false }
                )
                upload_to_testflight(api_key: api_key, app_identifier: bundle_id, apple_id: '6793296732', ipa: ipa, skip_waiting_for_build_processing: true) unless signing_only
                File.open(ENV.fetch('GITHUB_STEP_SUMMARY'), 'a') do |summary|
                  if signing_only
                    summary.puts("Signed PayPlace #{version} (#{build_number}) with Xcode; Expo submission result is reported below.")
                  else
                    summary.puts("Uploaded PayPlace #{version} (#{build_number}) to Apple. Apple processing and tester availability still need checking.")
                  end
                end
              ensure
                system('security', 'delete-keychain', keychain) if File.exist?(keychain)
                FileUtils.rm_f(installed_profile) if installed_profile
                FileUtils.rm_rf(temporary)
              end
            end
          end
          RUBY
          fastlane ios release
      - name: Submit signed release through Expo
        if: ${{ !inputs.validate_only && inputs.signing_only }}
        run: |
          npx --yes eas-cli@latest submit --platform ios --path "$RUNNER_TEMP/PayPlace.ipa" --profile production --non-interactive --wait
          echo 'Expo submission completed. Apple processing and tester availability still need checking.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save signed release artifact
        if: ${{ always() && !inputs.validate_only }}
        uses: actions/upload-artifact@v4
        with:
          name: PayPlace-iPhone-release
          path: ${{ runner.temp }}/PayPlace.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Save native validation log
        if: ${{ always() && inputs.validate_only }}
        uses: actions/upload-artifact@v4
        with:
          name: PayPlace-native-validation-log
          path: ${{ runner.temp }}/payplace-native-build.log
          if-no-files-found: ignore
          retention-days: 7

