name: Validate PayPlace

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check application bindings
        run: npm run check
      - name: Test opening, unlocking and saved plans
        run: npm test
      - name: Bundle iOS, Android and web
        run: npx expo export --platform all --output-dir dist --max-workers 2
