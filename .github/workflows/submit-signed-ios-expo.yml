name: Upload signed Build 77 to TestFlight
on:
  workflow_dispatch:
    inputs:
      approve_testflight_upload:
        description: Upload signed Build 77 to Apple for TestFlight processing
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: payplace-ios-local-release
  cancel-in-progress: false
jobs:
  submit:
    if: ${{ inputs.approve_testflight_upload }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d45298a219fa8993f8e209c70571bb66a9f4f0fa
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check upload access
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing encrypted repository secret EXPO_TOKEN"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: PayPlace-iPhone-release
          run-id: '44590362680'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/payplace-upload
          merge-multiple: true
      - name: Verify the signed archive identity
        env:
          IPA_PATH: ${{ runner.temp }}/payplace-upload/PayPlace.ipa
        run: |
          python3 - <<'PY'
          import os, plistlib, zipfile
          with zipfile.ZipFile(os.environ["IPA_PATH"]) as archive:
              names = [n for n in archive.namelist() if n.startswith("Payload/") and n.count("/") == 2 and n.endswith(".app/Info.plist")]
              assert len(names) == 1, "Expected exactly one main app"
              info = plistlib.loads(archive.read(names[0]))
              assert info["CFBundleIdentifier"] == "com.davelabranchejr.payplace"
              assert info["CFBundleShortVersionString"] == "1.0.0"
              assert info["CFBundleVersion"] == "77"
              assert str(info.get("DTSDKName", "")).startswith("iphoneos26"), "Expected the iOS 26 SDK"
              print("Verified PayPlace 1.0.0 (77), iOS 26 SDK")
          PY
      - name: Install project dependencies
        run: npm ci
      - name: Submit the existing signed archive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        run: npx --yes eas-cli@latest submit --platform ios --path "$RUNNER_TEMP/payplace-upload/PayPlace.ipa" --profile production --non-interactive --wait
      - name: Record completed submission
        run: echo 'Expo submission of signed PayPlace 1.0.0 (77) completed. Apple processing and tester availability still need checking.' >> "$GITHUB_STEP_SUMMARY"
